# Application Configuration
# -------------------------

generator {
  # Data generation settings
  data {
    # Base path for Delta Lake tables
    basePath = "/tmp/delta-lake-bmt"
    basePath = ${?DELTA_BASE_PATH}
    
    # Partition interval in minutes
    partitionInterval = 5
    
    # Number of days to generate
    daysToGenerate = 4
    daysToGenerate = ${?DAYS_TO_GENERATE}
    
    # Target data size per bucket in GB
    targetDataSizeGBPerBucket = 20.0
    targetDataSizeGBPerBucket = ${?GB_PER_BUCKET}
    
    # Number of partitions (files) per bucket
    partitionsPerBucket = 100
    partitionsPerBucket = ${?PARTITIONS_PER_BUCKET}
    
    # Number of records per bucket
    recordsPerBucket = 20000000
    recordsPerBucket = ${?RECORDS_PER_BUCKET}
  }
  
  # Table configurations
  tables {
    # Enable/disable specific tables
    webTraffic.enabled = true
    mobileTraffic.enabled = true
    userActivity.enabled = true
    transactions.enabled = true
    
    # Table-specific record counts (as percentage of recordsPerBucket)
    webTraffic.recordPercentage = 100
    mobileTraffic.recordPercentage = 100
    userActivity.recordPercentage = 100
    transactions.recordPercentage = 20  # Fewer transaction records
  }
  
  # Query settings
  queries {
    # Enable/disable query execution after data generation
    enabled = true
    
    # Number of queries to run
    queryCount = 10
    
    # Query timeout in seconds
    timeoutSeconds = 300
    
    # Show query results
    showResults = true
    
    # Maximum rows to display per query
    maxDisplayRows = 20
  }
}

# Spark Configuration
spark {
  # Application name
  appName = "DeltaLake BMT Application"
  
  # Master URL (can be overridden by spark-submit)
  master = "local[*]"
  master = ${?SPARK_MASTER}
  
  # Delta Lake settings
  delta {
    # Enable Delta optimizations
    optimizeWrite = true
    autoCompact = true
    
    # Checkpoint interval for streaming
    checkpointInterval = 10
  }
  
  # Performance tuning
  tuning {
    # Adaptive query execution
    adaptiveEnabled = true
    adaptiveCoalescePartitions = true
    
    # Shuffle partitions
    shufflePartitions = 200
    shufflePartitions = ${?SPARK_SHUFFLE_PARTITIONS}
    
    # Default parallelism
    defaultParallelism = 200
    defaultParallelism = ${?SPARK_DEFAULT_PARALLELISM}
    
    # Broadcast join threshold (in bytes)
    broadcastTimeout = 300
    autoBroadcastJoinThreshold = 104857600  # 100MB
  }
}

# AWS S3 Configuration
aws {
  # S3 settings
  s3 {
    # Access credentials
    accessKey = ""
    accessKey = ${?AWS_ACCESS_KEY}
    
    secretKey = ""
    secretKey = ${?AWS_SECRET_KEY}
    
    sessionToken = ""
    sessionToken = ${?AWS_SESSION_TOKEN}
    
    # IAM Role Configuration
    useIamRole = false
    useIamRole = ${?USE_IAM_ROLE}
    
    roleArn = ""
    roleArn = ${?AWS_ROLE_ARN}
    
    roleSessionName = "delta-lake-bmt-session"
    roleSessionName = ${?AWS_ROLE_SESSION_NAME}
    
    # S3 endpoint (for S3-compatible storage)
    endpoint = "https://s3.amazonaws.com"
    endpoint = ${?S3_ENDPOINT}
    
    # AWS region
    region = "us-east-1"
    region = ${?S3_REGION}
    
    # Bucket name
    bucket = ""
    bucket = ${?S3_BUCKET}
    
    # Prefix/folder within bucket
    prefix = "delta-lake-bmt"
    prefix = ${?S3_PREFIX}
    
    # Path style access (set to true for MinIO, etc.)
    pathStyleAccess = false
    pathStyleAccess = ${?S3_PATH_STYLE_ACCESS}
    
    # S3A filesystem performance settings
    fastUpload = true
    fastUpload = ${?S3_FAST_UPLOAD}
    
    fastUploadBuffer = "disk"
    fastUploadBuffer = ${?S3_FAST_UPLOAD_BUFFER}
    
    multipartSize = 104857600  # 100MB
    multipartSize = ${?S3_MULTIPART_SIZE}
    
    multipartThreshold = 2147483647  # 2GB
    multipartThreshold = ${?S3_MULTIPART_THRESHOLD}
    
    # Connection settings
    maxConnections = 100
    maxConnections = ${?S3_MAX_CONNECTIONS}
    
    connectionTimeout = 200000  # milliseconds
    connectionTimeout = ${?S3_CONNECTION_TIMEOUT}
    
    socketTimeout = 200000  # milliseconds
    socketTimeout = ${?S3_SOCKET_TIMEOUT}
    
    requestTimeout = 0  # 0 = no timeout
    requestTimeout = ${?S3_REQUEST_TIMEOUT}
    
    maxErrorRetry = 10
    maxErrorRetry = ${?S3_MAX_ERROR_RETRY}
    
    # SSL settings
    sslEnabled = true
    sslEnabled = ${?S3_SSL_ENABLED}
    
    sslVerify = true
    sslVerify = ${?S3_SSL_VERIFY}
    
    # S3 committer settings for optimized writes
    committer {
      enabled = true
      enabled = ${?S3_COMMITTER_ENABLED}
      
      name = "directory"  # Options: directory, partitioned, magic
      name = ${?S3_COMMITTER_NAME}
      
      stagingDir = "/tmp/spark-staging"
      stagingDir = ${?S3_COMMITTER_STAGING_DIR}
      
      conflictMode = "replace"  # Options: fail, append, replace
      conflictMode = ${?S3_COMMITTER_CONFLICT_MODE}
    }
  }
  
  # Parquet settings for S3
  parquet {
    blockSize = 134217728  # 128MB
    blockSize = ${?PARQUET_BLOCK_SIZE}
    
    pageSize = 1048576  # 1MB
    pageSize = ${?PARQUET_PAGE_SIZE}
    
    compression = "snappy"  # Options: snappy, gzip, lzo, brotli, lz4, zstd
    compression = ${?PARQUET_COMPRESSION}
    
    enableDictionary = true
    enableDictionary = ${?PARQUET_ENABLE_DICTIONARY}
  }
}

# Monitoring and Metrics
monitoring {
  # Enable metrics collection
  enabled = true
  
  # Metrics output interval (seconds)
  interval = 60
  
  # JMX settings
  jmx {
    enabled = false
    port = 9999
  }
}