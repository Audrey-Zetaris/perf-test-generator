#!/bin/bash
#######################################
# Delta Lake Performance Test Generator
# Configuration File - S3 Default
#######################################

# Spark Configuration
# --------------------
# Spark master URL (local[*], yarn, spark://host:port, k8s://https://host:port)
SPARK_MASTER="local[*]"

# Memory settings - Optimized for 8CPU/31GB EC2 instance
DRIVER_MEMORY="12g"
EXECUTOR_MEMORY="12g"
DRIVER_MAX_RESULT_SIZE="4g"

# Executor settings (for cluster mode)
EXECUTOR_INSTANCES="10"
EXECUTOR_CORES="8"

# Spark SQL settings - Optimized for S3
SPARK_SHUFFLE_PARTITIONS="400"
SPARK_DEFAULT_PARALLELISM="400"

# Spark Memory and File Settings (optimized for production S3 on 8CPU/31GB EC2)
SPARK_MAX_PARTITION_BYTES="268435456"  # 256MB - larger for S3 efficiency
SPARK_OPEN_COST_IN_BYTES="8388608"     # 8MB - higher for S3 latency
SPARK_DRIVER_MEMORY="12g"
SPARK_EXECUTOR_MEMORY="12g"
SPARK_DRIVER_MAX_RESULT_SIZE="4g"

# Data Generation Configuration
# ------------------------------
# Number of days of data to generate
DAYS_TO_GENERATE="4"

# Start date for data generation (format: yyyy-MM-dd)
# Leave empty to use current date/time
START_DATE=""

# Data volume per 5-minute bucket
GB_PER_BUCKET="20"

# Number of part files per bucket
PARTITIONS_PER_BUCKET="100"

# Number of records per bucket (60M records ≈ 20GB with ~300 bytes/record)
RECORDS_PER_BUCKET="60000000"

# AWS S3 Configuration (PRIMARY)
# --------------------------------
# Configure these settings to write data to S3

# S3 Bucket and Path (REQUIRED for S3)
S3_BUCKET=""  # REQUIRED: Enter your S3 bucket name here
S3_PREFIX="delta-lake-bmt"  # Folder within the bucket
S3_REGION="us-east-1"  # Your AWS region

# AWS Authentication - Choose ONE option:
# ----------------------------------------
# Option 1: Access Keys (Development/Testing)
AWS_ACCESS_KEY=""  # Your AWS Access Key ID
AWS_SECRET_KEY=""  # Your AWS Secret Access Key
#AWS_SESSION_TOKEN=""  # Optional: For temporary credentials

# Option 2: IAM Role (Production/EC2)
#USE_IAM_ROLE="true"  # Uncomment to use IAM role instead of keys
#AWS_ROLE_ARN=""  # Optional: Specific role to assume
#AWS_ROLE_SESSION_NAME="delta-lake-bmt-session"

# S3 Endpoint Configuration
S3_ENDPOINT="https://s3.amazonaws.com"  # AWS S3 endpoint
#S3_ENDPOINT="https://your-minio-server.com"  # For S3-compatible storage
S3_PATH_STYLE_ACCESS="false"  # Set to "true" for MinIO/Ceph

# S3 Performance Tuning (Optimized for 23TB)
# --------------------------------------------
S3_MULTIPART_SIZE="268435456"  # 256MB - optimal for large files
S3_MULTIPART_THRESHOLD="268435456"  # 256MB - use multipart for files > 256MB
S3_FAST_UPLOAD="true"  # Enable fast upload
S3_FAST_UPLOAD_BUFFER="disk"  # Disk buffering for stability
S3_MAX_CONNECTIONS="400"  # High connection count for parallelism
S3_CONNECTION_TIMEOUT="600000"  # 10 minutes
S3_SOCKET_TIMEOUT="600000"  # 10 minutes
S3_REQUEST_TIMEOUT="0"  # No timeout
S3_MAX_ERROR_RETRY="20"  # More retries for large transfers

# S3 SSL Configuration
S3_SSL_ENABLED="true"  # Enable SSL for S3 connections
S3_SSL_VERIFY="true"  # Verify SSL certificates

# S3-Specific Spark Configuration
# ---------------------------------
# Optimized settings for S3 operations

# S3 Committer Settings (Critical for S3 write performance)
S3_COMMITTER_ENABLED="true"
S3_COMMITTER_NAME="directory"  # Best for most cases
S3_COMMITTER_STAGING_DIR="/tmp/spark-staging"  # Local staging directory
S3_COMMITTER_CONFLICT_MODE="replace"  # Replace existing data

# Parquet Settings for S3 (Optimized for large files)
PARQUET_BLOCK_SIZE="536870912"  # 512MB - larger blocks for S3
PARQUET_PAGE_SIZE="10485760"  # 10MB - larger pages for S3
PARQUET_COMPRESSION="snappy"  # Fast compression
PARQUET_ENABLE_DICTIONARY="true"  # Enable dictionary encoding

# Delta Lake Settings for S3
DELTA_LOG_STORE_CLASS="org.apache.spark.sql.delta.storage.S3SingleDriverLogStore"
DELTA_MAX_SNAPSHOT_LINEAGE="50"  # Maximum number of delta files to retain
DELTA_CHECKPOINT_INTERVAL="10"  # Checkpoint every 10 commits
DELTA_CACHE_SIZE="10"  # Number of delta log files to cache

# Advanced Spark Tuning
# ---------------------------------
# Additional Spark configurations can be added here
# They will be passed as --conf parameters to spark-submit

# Adaptive Query Execution
#SPARK_CONF_spark_sql_adaptive_enabled="true"
#SPARK_CONF_spark_sql_adaptive_coalescePartitions_enabled="true"
#SPARK_CONF_spark_sql_adaptive_skewJoin_enabled="true"
#SPARK_CONF_spark_sql_adaptive_localShuffleReader_enabled="true"

# Memory Management
#SPARK_CONF_spark_memory_fraction="0.6"
#SPARK_CONF_spark_memory_storageFraction="0.5"
#SPARK_CONF_spark_memory_offHeap_enabled="true"
#SPARK_CONF_spark_memory_offHeap_size="4g"

# I/O Settings
#SPARK_CONF_spark_sql_files_maxPartitionBytes="134217728"  # 128MB
#SPARK_CONF_spark_sql_files_openCostInBytes="4194304"  # 4MB