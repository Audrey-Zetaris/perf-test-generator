#!/bin/bash
#######################################
# Local Filesystem Configuration Example
# Use this configuration for local testing without S3
#######################################

# Spark Configuration
# --------------------
# Spark master URL for local testing (4 cores for better performance)
SPARK_MASTER="local[4]"

# Memory settings - Conservative for 16GB RAM system
DRIVER_MEMORY="2g"
EXECUTOR_MEMORY="2g"
DRIVER_MAX_RESULT_SIZE="512m"

# Executor settings (not used in local mode)
EXECUTOR_INSTANCES="4"
EXECUTOR_CORES="4"

# Spark SQL settings (balanced for performance)
SPARK_SHUFFLE_PARTITIONS="4"
SPARK_DEFAULT_PARALLELISM="4"

# Spark Memory and File Settings (optimized for local testing)
SPARK_MAX_PARTITION_BYTES="1048576"  # 1MB
SPARK_OPEN_COST_IN_BYTES="262144"   # 256KB
SPARK_DRIVER_MEMORY="2g"
SPARK_EXECUTOR_MEMORY="2g"
SPARK_DRIVER_MAX_RESULT_SIZE="512m"

# Data Generation Configuration
# ------------------------------
# Number of days of data to generate (for local testing)
DAYS_TO_GENERATE="1"  # Just 1 day for local testing

# Data volume per 5-minute bucket (ultra-minimal for testing)
GB_PER_BUCKET="0.00001"  # 10KB per bucket for testing

# Number of part files per bucket
PARTITIONS_PER_BUCKET="1"  # Single partition for minimal memory

# Number of records per bucket (10 records ≈ 10KB with 1KB/record)
RECORDS_PER_BUCKET="10"

# Local Path Configuration
# -------------------------
# Base path for Delta Lake tables on local filesystem
DELTA_BASE_PATH="/tmp/delta-lake-bmt"

# Disable all S3 configurations for local mode
# ---------------------------------------------
S3_BUCKET=""  # Empty = use local filesystem
AWS_ACCESS_KEY=""
AWS_SECRET_KEY=""

# Local Optimizations
# --------------------
# No S3 committer needed for local filesystem
S3_COMMITTER_ENABLED="false"

# Smaller Parquet settings for local
PARQUET_BLOCK_SIZE="134217728"  # 128MB
PARQUET_PAGE_SIZE="1048576"  # 1MB
PARQUET_COMPRESSION="snappy"

# Standard Delta Lake settings for local
DELTA_LOG_STORE_CLASS=""  # Use default for local
DELTA_CHECKPOINT_INTERVAL="10"

# Notes for Local Testing
# ------------------------
# This configuration is optimized for very limited memory systems:
# - Ultra-minimal data volume (10KB per bucket instead of 20GB)
# - Only 2 hours of data (24 buckets instead of 1,152)  
# - Total data: ~240KB instead of 23TB (ultra-lightweight)
# - Memory usage: ~4GB total (2GB driver + 2GB executor)
# - Minimal resource usage for basic functionality testing
#
# To use this configuration:
# cp conf/local-example.conf conf/generator.conf
# ./bin/start-generator.sh